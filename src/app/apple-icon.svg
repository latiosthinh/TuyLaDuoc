<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="tld-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="tld-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="tld-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="32" height="32" rx="8" fill="url(#tld-bg)" />
  <!-- Inner border highlight -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="url(#tld-ring)" stroke-width="1" />

  <!-- Roulette spin orbit & ticks -->
  <circle cx="16" cy="16" r="9.5" stroke="#ffedd5" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="2 2" />

  <!-- 4 dynamic energy arcs (representing 4 decision domains: food, fun, activity, task) -->
  <path d="M16 7.5 A8.5 8.5 0 0 1 24.5 16" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.95" />
  <path d="M24.5 16 A8.5 8.5 0 0 1 16 24.5" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.55" />
  <path d="M16 24.5 A8.5 8.5 0 0 1 7.5 16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M7.5 16 A8.5 8.5 0 0 1 16 7.5" stroke="#fed7aa" stroke-width="1.8" stroke-linecap="round" opacity="0.4" />

  <!-- Center decision compass star / indicator needle -->
  <g filter="url(#shadow)">
    <path d="M16 9 L18.5 14.5 L23 16 L18.5 17.5 L16 23 L13.5 17.5 L9 16 L13.5 14.5 Z" fill="url(#tld-spark)" />
  </g>

  <!-- Center gem pivot -->
  <circle cx="16" cy="16" r="2.2" fill="#c2410c" />
  <circle cx="16" cy="16" r="1.1" fill="#ffffff" />
</svg>
